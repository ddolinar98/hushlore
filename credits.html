<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hushlore — Your Order</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: var(--bg); }
    .or-page { max-width:560px; margin:0 auto; padding:0 clamp(16px,4vw,32px) 60px; }
    .or-nav { display:flex; justify-content:center; padding:22px 0 6px; }
    .or-logo { font-family:var(--serif); font-size:26px; color:var(--cream); text-decoration:none; font-weight:500; }
    .or-logo span { color:var(--gold); }

    .or-card { background:var(--bg-card); border:1px solid var(--border); border-radius:18px;
      padding:30px clamp(20px,5vw,34px); margin-top:40px; text-align:center; }
    .or-eyebrow { font-family:var(--sans); font-size:11.5px; letter-spacing:.2em; text-transform:uppercase;
      color:var(--gold); font-weight:600; }
    .or-card h1 { font-family:var(--serif); font-size:30px; color:var(--cream); margin:8px 0 6px; font-weight:500; }
    .or-card p { font-family:var(--sans); font-size:15px; color:#a98ea3; line-height:1.6; margin:0 auto; max-width:400px; }

    .or-lines { text-align:left; margin:24px 0 6px; }
    .or-line { display:flex; justify-content:space-between; gap:14px; padding:13px 0; border-bottom:1px solid var(--border); }
    .or-line:last-child { border-bottom:none; }
    .or-line .k { font-family:var(--sans); font-size:14.5px; color:#a98ea3; }
    .or-line .v { font-family:var(--sans); font-size:14.5px; color:var(--cream); font-weight:600;
      font-variant-numeric:lining-nums tabular-nums; }
    .or-line .v.big { font-size:20px; color:var(--gold); }

    .pill { display:inline-block; font-family:var(--sans); font-size:11.5px; letter-spacing:.12em;
      text-transform:uppercase; border-radius:20px; padding:4px 12px; font-weight:700; }
    .pill.wait { background:rgba(192,51,88,.18); color:#ffb3c4; border:1px solid rgba(192,51,88,.45); }
    .pill.paid { background:rgba(53,208,127,.14); color:#7ef0b2; border:1px solid rgba(53,208,127,.4); }

    .or-btn { display:inline-block; background:var(--gold); color:#1a0d14; border:none; border-radius:10px;
      padding:15px 26px; font-family:var(--sans); font-size:15.5px; font-weight:700; cursor:pointer;
      text-decoration:none; margin-top:22px; }
    .or-alt { display:block; margin-top:16px; font-family:var(--sans); font-size:14px; color:#c1a7b8; text-decoration:none; }
    .or-note { font-family:var(--sans); font-size:12.5px; color:#8d7684; line-height:1.6; margin-top:20px;
      border-top:1px solid var(--border); padding-top:18px; }
  </style>
</head>
<body>
  <div class="or-page">
    <div class="or-nav"><a class="or-logo" href="library.html">Hush<span>lore</span></a></div>
    <div class="or-card" id="card">
      <p style="margin-top:10px">Loading your order…</p>
    </div>
  </div>

<script>
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function money(c){ return '$' + (c/100).toFixed(2); }

  var orderId = new URLSearchParams(location.search).get('order') || '';
  var poll = null;

  if (!orderId) {
    $('card').innerHTML = '<h1>No order found</h1><p>Head back to your messages and choose a bundle.</p>' +
      '<a class="or-btn" href="chat.html">Back to messages</a>';
  } else {
    load();
  }

  function load() {
    fetch('/api/chat/order-status?id=' + encodeURIComponent(orderId), { credentials:'same-origin' })
      .then(function (r) { return r.json().then(function (d) { return { ok:r.ok, d:d }; }); })
      .then(function (res) {
        if (!res.ok) {
          $('card').innerHTML = '<h1>We can\'t find that order</h1>' +
            '<p>It may belong to another account. Sign in with the email you use for Hushlore.</p>' +
            '<a class="or-btn" href="chat.html">Back to messages</a>';
          return;
        }
        render(res.d.order, res.d.credits);
      })
      .catch(function () {});
  }

  function render(o, credits) {
    var paid = o.status === 'paid';
    $('card').innerHTML =
      '<div class="or-eyebrow">' + (paid ? 'Payment received' : 'Your order') + '</div>' +
      '<h1>' + o.credits + ' messages</h1>' +
      '<p>' + (paid
        ? 'They\'ve been added to your account — you now have <b>' + credits + '</b> messages waiting.'
        : 'This order is saved and waiting for payment. Nothing has been charged yet.') + '</p>' +
      '<div class="or-lines">' +
        '<div class="or-line"><span class="k">Messages</span><span class="v">' + o.credits + '</span></div>' +
        '<div class="or-line"><span class="k">Price</span><span class="v big">' + money(o.price_cents) + '</span></div>' +
        '<div class="or-line"><span class="k">Status</span><span class="v">' +
          '<span class="pill ' + (paid ? 'paid' : 'wait') + '">' + (paid ? 'Paid' : 'Awaiting payment') + '</span></span></div>' +
        '<div class="or-line"><span class="k">Order</span><span class="v" style="font-size:12px;color:#8d7684">' +
          esc(o.id).slice(0, 8) + '</span></div>' +
      '</div>' +
      (paid
        ? '<a class="or-btn" href="chat.html">Start writing →</a>'
        : '<a class="or-btn" href="chat.html">Back to messages</a>' +
          '<div class="or-note">Card payments are being set up right now. Your order is held against your ' +
          'account — once payment is live you can complete it here, and the messages appear instantly. ' +
          'Anything unclear? Write to hello@hushlorewhisper.com and quote order ' + esc(o.id).slice(0, 8) + '.</div>');

    // if it's still pending, keep an eye out for the payment landing
    if (!paid && !poll) poll = setInterval(load, 6000);
    if (paid && poll) { clearInterval(poll); poll = null; }
  }
</script>
</body>
</html>
