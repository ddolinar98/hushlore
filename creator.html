<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hushlore — Creator Inbox</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: var(--bg); }
    .cr-page { max-width:1080px; margin:0 auto; padding:0 clamp(16px,4vw,40px) 60px; }
    .cr-nav { display:flex; align-items:center; justify-content:space-between; padding:22px 0 10px; }
    .cr-logo { font-family:var(--serif); font-size:26px; color:var(--cream); font-weight:500; }
    .cr-logo span { color:var(--gold); }
    .cr-who { font-family:var(--sans); font-size:14px; color:#a98ea3; }
    .cr-who b { color:var(--cream); }
    .cr-out { background:none; border:none; color:#8d7684; font-family:var(--sans); font-size:14px; cursor:pointer; margin-left:14px; }

    .cr-head { margin:16px 0 4px; }
    .cr-head h1 { font-family:var(--serif); font-weight:500; font-size:clamp(28px,4vw,40px); color:var(--cream); }
    .cr-stats { display:flex; gap:12px; margin-top:12px; flex-wrap:wrap; }
    .stat { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px 18px; min-width:130px; }
    .stat .k { font-family:var(--sans); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:#8d7684; }
    .stat .v { font-family:var(--sans); font-weight:600; font-size:26px; color:var(--cream); margin-top:2px; font-variant-numeric:lining-nums tabular-nums; }
    .stat .v.gold { color:var(--gold); }

    .cr-wrap { display:grid; grid-template-columns:300px 1fr; gap:18px; margin-top:22px; }
    @media (max-width:800px){ .cr-wrap{ grid-template-columns:1fr; }
      .cr-thread.hide-mobile{ display:none; } .cr-list.hide-mobile{ display:none; } }

    .cr-list { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; overflow:hidden; align-self:start; }
    .cr-list-h { font-family:var(--sans); font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:#a98ea3; padding:14px 16px 8px; }
    .cr-item { display:flex; gap:12px; align-items:center; padding:12px 16px; cursor:pointer; border-top:1px solid var(--border); }
    .cr-item:hover { background:var(--bg-elevated); }
    .cr-item.on { background:rgba(192,51,88,.12); }
    .cr-av { width:38px; height:38px; border-radius:50%; background:var(--bg-elevated); display:flex; align-items:center; justify-content:center;
      font-family:var(--sans); color:#c1a7b8; font-size:13px; flex:0 0 auto; }
    .cr-item-b { min-width:0; flex:1; }
    .cr-item-n { font-family:var(--sans); font-size:14.5px; color:var(--cream); font-weight:600; }
    .cr-item-p { font-family:var(--sans); font-size:12.5px; color:#8d7684; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cr-dot { min-width:20px; height:20px; border-radius:10px; background:var(--gold); color:#1a0d14; font-family:var(--sans);
      font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 6px; flex:0 0 auto; }

    .cr-thread { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; display:flex; flex-direction:column; min-height:520px; }
    .cr-thread-h { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border); }
    .cr-thread-h .n { font-family:var(--sans); font-size:16px; color:var(--cream); font-weight:600; }
    .cr-thread-h .s { font-family:var(--sans); font-size:12px; color:#8d7684; }
    .cr-back { display:none; background:none; border:none; color:#c1a7b8; font-size:20px; cursor:pointer; }
    @media (max-width:800px){ .cr-back{ display:block; } }

    .cr-msgs { flex:1; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent; padding:18px; display:flex; flex-direction:column; gap:10px; max-height:52vh; }
    .msg { max-width:74%; padding:11px 14px; border-radius:14px; font-family:var(--sans); font-size:15px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
    .msg.me { align-self:flex-end; background:var(--gold); color:#1a0d14; border-bottom-right-radius:4px; }
    .msg.them { align-self:flex-start; background:var(--bg-elevated); color:var(--cream); border:1px solid var(--border); border-bottom-left-radius:4px; }
    .msg.onbehalf { border:1px dashed rgba(26,13,20,.55); }
    .msg.staff { align-self:center; max-width:88%; background:rgba(120,90,200,.16); border:1px solid rgba(150,120,230,.4); color:#e6dcff; }
    .msg-who { font-family:var(--sans); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; opacity:.8; margin-bottom:3px; }
    .msg-t { font-family:var(--sans); font-size:10.5px; opacity:.6; margin-top:4px; }

    .ad-msgs::-webkit-scrollbar, .ch-msgs::-webkit-scrollbar, .cr-msgs::-webkit-scrollbar { width:8px; }
    .ad-msgs::-webkit-scrollbar-track, .ch-msgs::-webkit-scrollbar-track, .cr-msgs::-webkit-scrollbar-track { background:transparent; }
    .ad-msgs::-webkit-scrollbar-thumb, .ch-msgs::-webkit-scrollbar-thumb, .cr-msgs::-webkit-scrollbar-thumb {
      background:var(--border-strong); border-radius:8px; }
    .cr-compose { border-top:1px solid var(--border); padding:12px; display:flex; gap:10px; align-items:flex-end; }
    .cr-compose textarea { flex:1; resize:none; background:var(--bg-elevated); border:1px solid var(--border); border-radius:10px;
      padding:12px 14px; color:var(--cream); font-family:var(--sans); font-size:15px; min-height:46px; max-height:140px; }
    .cr-compose textarea:focus { outline:none; border-color:var(--gold); }
    .cr-send { background:var(--gold); color:#1a0d14; border:none; border-radius:10px; padding:13px 20px;
      font-family:var(--sans); font-weight:700; font-size:15px; cursor:pointer; }
    .cr-note { font-family:var(--sans); font-size:11.5px; color:#8d7684; padding:0 14px 12px; }
    .cr-blank { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px 24px;
      font-family:var(--sans); color:#8d7684; font-size:14.5px; }
    .cr-empty { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px 24px;
      font-family:var(--sans); color:#8d7684; font-size:15px; line-height:1.6; }
  </style>
</head>
<body>
<div class="cr-page">
  <div class="cr-nav">
    <div class="cr-logo">Hush<span>lore</span></div>
    <div class="cr-who">Signed in as <b id="whoName">…</b><button class="cr-out" id="out">Sign out</button></div>
  </div>

  <div class="cr-head">
    <h1>Your inbox</h1>
    <div class="cr-stats">
      <div class="stat"><div class="k">Waiting</div><div class="v gold" id="stWaiting">–</div></div>
      <div class="stat"><div class="k">Conversations</div><div class="v" id="stThreads">–</div></div>
      <div class="stat"><div class="k">Replies sent</div><div class="v" id="stReplies">–</div></div>
    </div>
  </div>

  <div class="cr-wrap">
    <div class="cr-list" id="list"><div class="cr-list-h">Listeners</div></div>
    <div class="cr-thread hide-mobile" id="thread">
      <div class="cr-empty" id="empty">Pick a conversation on the left.<br />Listeners are anonymous — you only ever see a nickname.</div>
    </div>
  </div>
</div>

<script>
  var state = { threads: [], active: null, poll: null, lastAt: null, replies: 0 };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function api(p,o){ return fetch(p, Object.assign({credentials:'same-origin'}, o||{})).then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); }); }
  function timeOf(iso){ return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }

  api('/api/chat/me').then(function (r) {
    if (!r.d.authenticated) return location.replace('login.html?next=creator.html');
    if (!r.d.is_creator)    return location.replace('library.html');
    $('whoName').textContent = r.d.creator.display_name;
    load();
    setInterval(load, 15000);           // refresh inbox
  });

  function load() {
    api('/api/chat/threads').then(function (r) {
      state.threads = r.d.threads || [];
      $('stThreads').textContent = state.threads.length;
      $('stWaiting').textContent = state.threads.filter(function(t){ return t.unread > 0; }).length;
      renderList();
    });
  }

  function renderList() {
    var html = '<div class="cr-list-h">Listeners</div>';
    if (!state.threads.length) html += '<div style="padding:16px;font-family:var(--sans);color:#8d7684;font-size:14px">No messages yet.</div>';
    state.threads.forEach(function (t) {
      html += '<div class="cr-item' + (state.active && state.active.id === t.id ? ' on' : '') + '" data-id="' + esc(t.id) + '" data-who="' + esc(t.who) + '">' +
        '<div class="cr-av">' + esc(t.who.replace('Listener #','')) + '</div>' +
        '<div class="cr-item-b"><div class="cr-item-n">' + esc(t.who) + '</div>' +
        '<div class="cr-item-p">' + esc(t.preview || '') + '</div></div>' +
        (t.unread ? '<div class="cr-dot">' + t.unread + '</div>' : '') + '</div>';
    });
    $('list').innerHTML = html;
    [].forEach.call($('list').querySelectorAll('.cr-item'), function (el) {
      el.onclick = function () { open(el.getAttribute('data-id'), el.getAttribute('data-who')); };
    });
  }

  function open(id, who) {
    state.active = { id: id, who: who };
    state.lastAt = null;
    $('thread').innerHTML =
      '<div class="cr-thread-h"><button class="cr-back" id="back">‹</button>' +
      '<div class="cr-av">' + esc(who.replace('Listener #','')) + '</div>' +
      '<div><div class="n">' + esc(who) + '</div><div class="s">anonymous listener</div></div></div>' +
      '<div class="cr-msgs" id="msgs"></div>' +
      '<div class="cr-blank" id="blank">No messages in this conversation yet.</div>' +
      '<div class="cr-compose"><textarea id="box" rows="1" placeholder="Write a reply…"></textarea>' +
      '<button class="cr-send" id="send">Reply</button></div>' +
      '<div class="cr-note">Replies are free for the listener and count towards your earnings. Never share contact details or personal information here.</div>';
    $('back').onclick = function(){ $('thread').classList.add('hide-mobile'); $('list').classList.remove('hide-mobile'); };
    $('send').onclick = send;
    $('box').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    $('thread').classList.remove('hide-mobile');
    $('list').classList.add('hide-mobile');
    renderList();
    pull();
    if (state.poll) clearInterval(state.poll);
    state.poll = setInterval(pull, 5000);
  }

  function add(msgs) {
    var box = $('msgs'); if (!box) return;
    msgs.forEach(function (m) {
      var d = document.createElement('div');
      d.className = 'msg ' + (m.sender === 'creator' ? 'me' : (m.sender === 'admin' ? 'staff' : 'them'));
      var tag = m.sender === 'admin' ? 'Hushlore Team'
              : (m.sender === 'creator' && m.sent_by ? 'Sent for you by Hushlore' : '');
      if (m.sender === 'creator' && m.sent_by) d.classList.add('onbehalf');
      d.innerHTML = (tag ? '<div class="msg-who">' + tag + '</div>' : '') +
                    esc(m.body) + '<div class="msg-t">' + timeOf(m.created_at) + '</div>';
      box.appendChild(d);
      state.lastAt = m.created_at;
      if (m.sender === 'creator') { state.replies++; $('stReplies').textContent = state.replies; }
    });
    box.scrollTop = box.scrollHeight;
    var blank = $('blank');
    if (blank) blank.style.display = box.children.length ? 'none' : 'flex';
    box.style.flex = box.children.length ? '1' : '0';
  }

  function pull() {
    if (!state.active) return;
    api('/api/chat/messages?thread=' + encodeURIComponent(state.active.id) + (state.lastAt ? '&since=' + encodeURIComponent(state.lastAt) : ''))
      .then(function (r) { if (r.ok && r.d.messages && r.d.messages.length) add(r.d.messages); });
  }

  function send() {
    var box = $('box'); var text = box.value.trim();
    if (!text || !state.active) return;
    $('send').disabled = true;
    api('/api/chat/send', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ thread: state.active.id, body: text }) })
      .then(function (r) {
        $('send').disabled = false;
        if (!r.ok) { if (r.d.error !== 'too_fast') alert('Reply could not be sent.'); return; }
        box.value = '';
        add([{ sender:'creator', body:text, created_at:r.d.created_at }]);
      });
  }

  $('out').onclick = function () {
    fetch('/api/auth/logout', { method:'POST', credentials:'same-origin' })
      .catch(function(){}).then(function(){ location.href = 'login.html'; });
  };
</script>
</body>
</html>
